name: Mirror GitHub repositories to GitLab

# Started every 10 minutes by the Google Apps Script clock in apps-script/,
# hourly by backup.yml, and on pushes. It has no schedule of its own, so
# GitHub's 60-day inactivity rule for scheduled workflows never disables it.
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    # Job level, so runs started through backup.yml share the same queue.
    concurrency:
      group: github-to-gitlab-mirror
      cancel-in-progress: false
    timeout-minutes: 60
    steps:
      - name: Read mirror script at this workflow's revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.request
          url = ('https://api.github.com/repos/' + os.environ['GH_REPOSITORY']
                 + '/contents/mirror.py?ref=' + os.environ['GH_SHA'])
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github.raw+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              source = response.read()
          with open('mirror.py', 'wb') as output:
              output.write(source)
          PY
      - name: Mirror repositories
        env:
          SOURCE_GITHUB_TOKEN: ${{ secrets.SOURCE_GITHUB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          SECRETS_GITHUB_TOKEN: ${{ secrets.SECRETS_GITHUB_TOKEN }}
        run: python3 mirror.py
